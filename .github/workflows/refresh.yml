name: Refresh prices

on:
  # Also keeps the Supabase free-tier project out of its 7-day-inactivity
  # auto-pause, since this hits the API every hour. If this schedule ever
  # changes, check the Supabase dashboard isn't paused.
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:          # allows manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_prices.py
